    <!-- Script para manejar la ruta a google maps -->
    <script>
    function abrirRuta() {
        const origen = document.getElementById("origen").value;
        const destino = document.getElementById("destino").value;

        if (!origen || !destino) {
            alert("Debes seleccionar tanto el origen como el destino.");
            return;
        }

        if (origen === destino) {
            alert("El origen y el destino no pueden ser iguales.");
            return;
        }

        window.pywebview.api.abrir_ruta(parseInt(origen), parseInt(destino)).then(response => {
            if (response.status !== "ok") {
                alert("Error al abrir la ruta: " + response.msg);
            }
        });
    }
    </script>
